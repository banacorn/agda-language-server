# Reusable workflow: runs one cold or warm attempt for every matrix entry
# of one repetition. Called three times per repetition (once for `cold`,
# once for `warm`, the latter needing the former) by
# cache-benchmark.yaml, which is the only workflow meant to invoke this
# one. See that file's header comment for the overall design.
name: Cache Benchmark Phase

on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string      # "cold" | "warm"
      rep:
        required: true
        type: number
      entries_json:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      redesign_sha:
        required: true
        type: string
      benchmark_repository:
        required: true
        type: string
      stack_version:
        required: true
        type: string
      ghc_wasm_meta_commit_hash:
        required: true
        type: string
      ghc_wasm_meta_flavour:
        required: true
        type: string
      alex_version:
        required: true
        type: string
      happy_version:
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  attempt:
    name: ${{ inputs.phase }} / ${{ matrix.strategy }} / ${{ matrix.id }} / rep${{ inputs.rep }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.entries_json) }}
    steps:
      - name: Checkout source (${{ matrix.strategy == 'legacy' && 'BASE_SHA' || 'REDESIGN_SHA' }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.strategy == 'legacy' && inputs.base_sha || inputs.redesign_sha }}
          path: src
          submodules: ${{ matrix.kind == 'wasm' && 'recursive' || 'false' }}

      - name: Export matrix fields
        run: |
          {
            echo "ENTRY_ID=${{ matrix.id }}"
            echo "ENTRY_KIND=${{ matrix.kind }}"
            echo "STRATEGY=${{ matrix.strategy }}"
            echo "REP=${{ inputs.rep }}"
            echo "ARCH=${{ matrix.arch }}"
            echo "AGDA_NAME=${{ matrix.agda_name }}"
            echo "AGDA_LABEL=${{ matrix.agda_label }}"
            echo "AGDA_FLAG=${{ matrix.agda_flag }}"
            echo "AGDA_COMMIT=${{ matrix.agda_commit }}"
            echo "GROUP=${{ matrix.group }}"
            echo "IS_WRITER=${{ matrix.is_writer }}"
            echo "PAIR_ID=${{ matrix.pair_id }}"
            echo "PREFIX=${{ matrix.prefix }}"
            echo "PHASE=${{ inputs.phase }}"
            echo "RUNNER_OS=${{ runner.os }}"
            echo "RUNNER_ARCH=${{ runner.arch }}"
            echo "BENCHMARK_REPOSITORY=${{ inputs.benchmark_repository }}"
            echo "STACK_VERSION=${{ inputs.stack_version }}"
            echo "GHC_WASM_META_COMMIT_HASH=${{ inputs.ghc_wasm_meta_commit_hash }}"
            echo "GHC_WASM_META_FLAVOUR=${{ inputs.ghc_wasm_meta_flavour }}"
            echo "ALEX_VERSION=${{ inputs.alex_version }}"
            echo "HAPPY_VERSION=${{ inputs.happy_version }}"
          } >> "$GITHUB_ENV"

      - name: Verify prior (cold) cache entries survived
        if: inputs.phase == 'warm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/scripts/cache-benchmark/lib.sh
          n="$(cache_list_all "${BENCHMARK_REPOSITORY}" "${PREFIX}" | jq 'length')"
          echo "found ${n} cache entries under prefix ${PREFIX} before warm run"
          if [[ "$n" -eq 0 ]]; then
            echo "::error::no cache entries survived from the cold run for pair '${PAIR_ID}' (prefix ${PREFIX}); this sample is invalid and must be discarded and re-run under a new pair id"
            exit 1
          fi

      #### native ###############################################################

      - name: Install yq (Windows)
        if: matrix.kind == 'native' && runner.os == 'Windows'
        uses: frenck/action-setup-yq@v1

      - name: Resolve Stack config for this Agda target
        if: matrix.kind == 'native'
        working-directory: src
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cache-benchmark/resolve-native-env.sh"

      - name: Compute toolchain cache config
        if: matrix.kind == 'native'
        run: bash .github/scripts/cache-benchmark/compute-cache-config.sh secondary

      - name: Restore Haskell toolchain cache
        if: matrix.kind == 'native' && env.SECONDARY_ACTIVE == 'true'
        id: restore-secondary-native
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SECONDARY_PATHS }}
          key: ${{ env.SECONDARY_KEY }}
          restore-keys: ${{ env.SECONDARY_EXACT_ONLY == 'false' && env.SECONDARY_RESTORE_KEYS || '' }}

      - name: Setup Haskell (legacy, macOS only)
        if: matrix.kind == 'native' && matrix.strategy == 'legacy' && runner.os == 'macOS'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          enable-stack: true
          stack-version: 'latest'

      - name: Setup Haskell (redesigned, pinned Stack version, all platforms)
        if: matrix.kind == 'native' && matrix.strategy == 'redesigned'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          enable-stack: true
          stack-version: ${{ inputs.stack_version }}

      - name: Verify Stack version
        if: matrix.kind == 'native'
        run: |
          actual="$(stack --numeric-version)"
          echo "resolved Stack version: ${actual}"
          if [[ "${STRATEGY}" == "redesigned" && "${actual}" != "${STACK_VERSION}" ]]; then
            echo "::error::redesigned policy requires pinned Stack ${STACK_VERSION}, got ${actual}"
            exit 1
          fi

      - name: Determine Stack root
        if: matrix.kind == 'native'
        working-directory: src
        run: echo "STACK_ROOT=$(stack path $STACK_YAML_ARG --stack-root)" >> "$GITHUB_ENV"

      - name: Resolve ICU version
        if: matrix.kind == 'native'
        run: bash .github/scripts/cache-benchmark/resolve-icu-version.sh

      - name: Compute compiled-dependency cache config
        if: matrix.kind == 'native'
        run: bash .github/scripts/cache-benchmark/compute-cache-config.sh primary

      - name: Start restore timer
        if: matrix.kind == 'native'
        run: echo "T_RESTORE_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Restore compiled-dependency cache
        if: matrix.kind == 'native'
        id: restore-primary-native
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PRIMARY_PATHS }}
          key: ${{ env.PRIMARY_KEY }}
          restore-keys: ${{ env.PRIMARY_RESTORE_KEYS }}

      - name: Record restore duration
        if: matrix.kind == 'native'
        run: echo "PRIMARY_RESTORE_MS=$(( $(date +%s%3N) - T_RESTORE_START ))" >> "$GITHUB_ENV"

      - name: Start build timer
        if: matrix.kind == 'native'
        run: echo "T_BUILD_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Build snapshot and dependencies
        if: matrix.kind == 'native'
        id: build-deps-native
        working-directory: src
        run: |
          stack build $STACK_YAML_ARG --no-terminal --only-snapshot -j1
          stack build $STACK_YAML_ARG --no-terminal --only-dependencies
          stack build $STACK_YAML_ARG --test --no-terminal --only-dependencies

      - name: Record build duration
        if: matrix.kind == 'native'
        run: echo "BUILD_MS=$(( $(date +%s%3N) - T_BUILD_START ))" >> "$GITHUB_ENV"

      - name: Measure uncompressed cache directory sizes
        if: matrix.kind == 'native'
        run: |
          source .github/scripts/cache-benchmark/lib.sh
          echo "PRIMARY_SIZE_BYTES=$(dir_size_bytes ${PRIMARY_PATHS})" >> "$GITHUB_ENV"
          if [[ "${SECONDARY_ACTIVE}" == "true" ]]; then
            echo "SECONDARY_SIZE_BYTES=$(dir_size_bytes ${SECONDARY_PATHS})" >> "$GITHUB_ENV"
          fi

      - name: Start save timer
        if: matrix.kind == 'native'
        run: echo "T_SAVE_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Save Haskell toolchain cache
        if: >
          matrix.kind == 'native' && env.SECONDARY_ACTIVE == 'true' &&
          matrix.is_writer == true && steps.restore-secondary-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SECONDARY_PATHS }}
          key: ${{ env.SECONDARY_KEY }}

      - name: Save compiled-dependency cache
        if: >
          matrix.kind == 'native' && matrix.is_writer == true &&
          steps.build-deps-native.outcome == 'success' &&
          steps.restore-primary-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PRIMARY_PATHS }}
          key: ${{ env.PRIMARY_KEY }}

      - name: Record save duration
        if: matrix.kind == 'native'
        run: echo "SAVE_MS=$(( $(date +%s%3N) - T_SAVE_START ))" >> "$GITHUB_ENV"

      - name: Record native measurement
        if: matrix.kind == 'native'
        env:
          PRIMARY_CACHE_HIT: ${{ steps.restore-primary-native.outputs.cache-hit }}
          PRIMARY_CACHE_MATCHED_KEY: ${{ steps.restore-primary-native.outputs.cache-matched-key }}
          SECONDARY_CACHE_HIT: ${{ steps.restore-secondary-native.outputs.cache-hit }}
          SECONDARY_CACHE_MATCHED_KEY: ${{ steps.restore-secondary-native.outputs.cache-matched-key }}
        run: bash .github/scripts/cache-benchmark/record-measurement.sh measurement.json

      #### wasm ##################################################################

      - name: Compute WASM toolchain cache config
        if: matrix.kind == 'wasm'
        run: bash .github/scripts/cache-benchmark/compute-cache-config.sh primary

      - name: Start restore timer (wasm)
        if: matrix.kind == 'wasm'
        run: echo "T_RESTORE_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Restore ghc-wasm-meta toolchain cache
        if: matrix.kind == 'wasm'
        id: restore-primary-wasm
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PRIMARY_PATHS }}
          key: ${{ env.PRIMARY_KEY }}
          restore-keys: ${{ env.PRIMARY_EXACT_ONLY == 'false' && env.PRIMARY_RESTORE_KEYS || '' }}

      - name: Clone and setup ghc-wasm-meta (legacy, on prefix miss)
        if: matrix.kind == 'wasm' && matrix.strategy == 'legacy' && steps.restore-primary-wasm.outputs.cache-matched-key == ''
        id: wasm-setup
        run: |
          mkdir ghc-wasm-meta && cd ghc-wasm-meta
          git config --global init.defaultBranch dontcare
          git config --global advice.detachedHead false
          git init
          git remote add origin https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta.git
          git fetch origin "${GHC_WASM_META_COMMIT_HASH}" --depth=1
          git checkout FETCH_HEAD
          FLAVOUR="${GHC_WASM_META_FLAVOUR}" ./setup.sh

      - name: Clone and setup ghc-wasm-meta (redesigned, on exact miss)
        if: matrix.kind == 'wasm' && matrix.strategy == 'redesigned' && steps.restore-primary-wasm.outputs.cache-hit != 'true'
        id: wasm-setup-redesigned
        run: |
          mkdir ghc-wasm-meta && cd ghc-wasm-meta
          git config --global init.defaultBranch dontcare
          git config --global advice.detachedHead false
          git init
          git remote add origin https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta.git
          git fetch origin "${GHC_WASM_META_COMMIT_HASH}" --depth=1
          git checkout FETCH_HEAD
          FLAVOUR="${GHC_WASM_META_FLAVOUR}" ./setup.sh

      - name: Record restore duration (wasm)
        if: matrix.kind == 'wasm'
        run: echo "PRIMARY_RESTORE_MS=$(( $(date +%s%3N) - T_RESTORE_START ))" >> "$GITHUB_ENV"

      - name: Add ghc-wasm-meta to PATH
        if: matrix.kind == 'wasm'
        run: ~/.ghc-wasm/add_to_github_path.sh

      - name: Update wasm32 cabal index
        if: matrix.kind == 'wasm'
        run: wasm32-wasi-cabal update

      - name: Resolve host Cabal version
        if: matrix.kind == 'wasm'
        run: echo "CABAL_VERSION=$(~/.ghc-wasm/cabal/bin/cabal --numeric-version)" >> "$GITHUB_ENV"

      - name: Compute native-utilities cache config
        if: matrix.kind == 'wasm'
        run: bash .github/scripts/cache-benchmark/compute-cache-config.sh secondary

      - name: Restore native-utilities cache
        if: matrix.kind == 'wasm'
        id: restore-secondary-wasm
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SECONDARY_PATHS }}
          key: ${{ env.SECONDARY_KEY }}
          restore-keys: ${{ env.SECONDARY_EXACT_ONLY == 'false' && env.SECONDARY_RESTORE_KEYS || '' }}

      - name: Install native utilities (legacy, unconditional)
        if: matrix.kind == 'wasm' && matrix.strategy == 'legacy'
        run: |
          ~/.ghc-wasm/cabal/bin/cabal update
          ~/.ghc-wasm/cabal/bin/cabal install "alex-${ALEX_VERSION}" "happy-${HAPPY_VERSION}"

      - name: Validate restored native utilities (redesigned, exact hit)
        if: matrix.kind == 'wasm' && matrix.strategy == 'redesigned' && steps.restore-secondary-wasm.outputs.cache-hit == 'true'
        run: bash .github/scripts/cache-benchmark/validate-native-utils.sh

      - name: Install native utilities (redesigned, on exact miss)
        if: matrix.kind == 'wasm' && matrix.strategy == 'redesigned' && steps.restore-secondary-wasm.outputs.cache-hit != 'true'
        id: install-native-utils
        run: |
          ~/.ghc-wasm/cabal/bin/cabal update
          ~/.ghc-wasm/cabal/bin/cabal install "alex-${ALEX_VERSION}" "happy-${HAPPY_VERSION}"

      - name: Validate installed native utilities (redesigned, after install)
        if: matrix.kind == 'wasm' && matrix.strategy == 'redesigned' && steps.install-native-utils.outcome == 'success'
        run: bash .github/scripts/cache-benchmark/validate-native-utils.sh

      - name: Checkout Agda submodule at pinned commit
        if: matrix.kind == 'wasm'
        working-directory: src/wasm-submodules/agda
        run: |
          git fetch --depth 1 origin "${AGDA_COMMIT}"
          git checkout FETCH_HEAD

      - name: Start build timer (wasm)
        if: matrix.kind == 'wasm'
        run: echo "T_BUILD_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Cabal configure
        if: matrix.kind == 'wasm'
        working-directory: src
        run: |
          mv cabal.project.wasm32 cabal.project
          wasm32-wasi-cabal configure --flag="Agda-${AGDA_FLAG}"

      - name: Build Agda as dependency
        if: matrix.kind == 'wasm'
        working-directory: src
        run: wasm32-wasi-cabal build lib:agda

      - name: Build remaining dependencies
        if: matrix.kind == 'wasm'
        id: build-deps-wasm
        working-directory: src
        run: |
          cd wasm-submodules/network && autoreconf -i && cd ../..
          wasm32-wasi-cabal build --dependencies-only

      - name: Record build duration (wasm)
        if: matrix.kind == 'wasm'
        run: echo "BUILD_MS=$(( $(date +%s%3N) - T_BUILD_START ))" >> "$GITHUB_ENV"

      - name: Measure uncompressed cache directory sizes (wasm)
        if: matrix.kind == 'wasm'
        run: |
          source .github/scripts/cache-benchmark/lib.sh
          echo "PRIMARY_SIZE_BYTES=$(dir_size_bytes ${PRIMARY_PATHS})" >> "$GITHUB_ENV"
          echo "SECONDARY_SIZE_BYTES=$(dir_size_bytes ${SECONDARY_PATHS})" >> "$GITHUB_ENV"

      - name: Clean up cabal logs before saving
        if: matrix.kind == 'wasm'
        run: rm -rf ~/.cache/cabal/logs ~/.ghc-wasm/.cabal/logs

      - name: Start save timer (wasm)
        if: matrix.kind == 'wasm'
        run: echo "T_SAVE_START=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Save ghc-wasm-meta toolchain cache (legacy)
        if: >
          matrix.kind == 'wasm' && matrix.strategy == 'legacy' && matrix.is_writer == true &&
          steps.restore-primary-wasm.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PRIMARY_PATHS }}
          key: ${{ env.PRIMARY_KEY }}

      - name: Save ghc-wasm-meta toolchain cache (redesigned)
        if: >
          matrix.kind == 'wasm' && matrix.strategy == 'redesigned' && matrix.is_writer == true &&
          steps.restore-primary-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PRIMARY_PATHS }}
          key: ${{ env.PRIMARY_KEY }}

      - name: Save native-utilities / native-cabal cache
        if: >
          matrix.kind == 'wasm' && matrix.is_writer == true &&
          steps.restore-secondary-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SECONDARY_PATHS }}
          key: ${{ env.SECONDARY_KEY }}

      - name: Record save duration (wasm)
        if: matrix.kind == 'wasm'
        run: echo "SAVE_MS=$(( $(date +%s%3N) - T_SAVE_START ))" >> "$GITHUB_ENV"

      - name: Record wasm measurement
        if: matrix.kind == 'wasm'
        env:
          PRIMARY_CACHE_HIT: ${{ steps.restore-primary-wasm.outputs.cache-hit }}
          PRIMARY_CACHE_MATCHED_KEY: ${{ steps.restore-primary-wasm.outputs.cache-matched-key }}
          SECONDARY_CACHE_HIT: ${{ steps.restore-secondary-wasm.outputs.cache-hit }}
          SECONDARY_CACHE_MATCHED_KEY: ${{ steps.restore-secondary-wasm.outputs.cache-matched-key }}
        run: bash .github/scripts/cache-benchmark/record-measurement.sh measurement.json

      #### shared upload #########################################################

      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-${{ inputs.phase }}-${{ matrix.strategy }}-${{ matrix.id }}-rep${{ inputs.rep }}
          path: measurement.json
          retention-days: 1
          if-no-files-found: warn
