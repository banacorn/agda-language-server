# Cache Benchmark harness (PR 1, commit 1 of ci.md: "Add reproducible
# cache measurements"). Compares the legacy cache policy (as currently
# implemented inline in test.yaml/wasm.yaml) against the redesigned
# policy specified by ci.md PR 1 commits 2 and 3, using one shared harness
# so both strategies are measured the same way. See:
#   .github/scripts/cache-policy.sh            - both policies' paths/keys
#   .github/scripts/cache-benchmark/lib.sh     - cache-API helpers
#   .github/workflows/cache-benchmark-phase.yaml   - one cold/warm attempt
#   .github/workflows/cache-benchmark-settle.yaml  - per-group inventory+cleanup
#
# Deliberately out of scope (see ci.md commit 1's own framing: this
# measures *cache* behavior, not full CI parity): artifact bundling
# (dylib/zip packaging), running the test suite, and release publication.
# Only the dependency-producing steps that populate the caches under
# comparison are exercised.
#
# Safety: this workflow refuses to run anywhere except the validated fork
# named by BENCHMARK_REPOSITORY, and every job that can mutate caches is
# scoped to that repository only -- see job `validate-fork`.
#
# Manual cleanup fallback (after a cancelled run, or a failure before the
# `cleanup` job below could execute):
#   GH_TOKEN=<token with actions:write on the fork> \
#     .github/scripts/cache-benchmark/manual-cleanup.sh \
#     banacorn/agda-language-server ci-cache-benchmark-<strategy>-<group>-rep<N>-

name: Cache Benchmark

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Full 40-character commit SHA of the unchanged base source (BASE_SHA)'
        required: true
      redesign_sha:
        description: 'Full 40-character commit SHA of the redesigned-cache source (REDESIGN_SHA)'
        required: true

env:
  UPSTREAM_REPOSITORY: agda/agda-language-server
  BENCHMARK_REPOSITORY: banacorn/agda-language-server
  HARNESS_SHA: ${{ github.sha }}
  STACK_VERSION: '3.1.1'
  GHC_WASM_META_FLAVOUR: '9.10'
  GHC_WASM_META_COMMIT_HASH: 'c3f44696d29aaeadd755d69c51735954bfcd59db'
  ALEX_VERSION: '3.5.0.0'
  HAPPY_VERSION: '1.20.1.1'

defaults:
  run:
    shell: bash

concurrency:
  group: cache-benchmark-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-fork:
    name: Validate benchmark fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate inputs and BENCHMARK_REPOSITORY
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ inputs.base_sha }}
          REDESIGN_SHA: ${{ inputs.redesign_sha }}
        run: |
          set -euo pipefail

          for sha in "$BASE_SHA" "$REDESIGN_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::'${sha}' is not a full 40-character lowercase-hex commit SHA"
              exit 1
            fi
          done

          if [[ "${{ github.repository }}" != "${BENCHMARK_REPOSITORY}" ]]; then
            echo "::error::this workflow may only run in BENCHMARK_REPOSITORY (${BENCHMARK_REPOSITORY}); current repository is ${{ github.repository }}"
            exit 1
          fi
          if [[ "${BENCHMARK_REPOSITORY}" == "${UPSTREAM_REPOSITORY}" ]]; then
            echo "::error::BENCHMARK_REPOSITORY must not equal UPSTREAM_REPOSITORY"
            exit 1
          fi

          info="$(gh api "repos/${BENCHMARK_REPOSITORY}")"
          is_fork="$(jq -r '.fork' <<<"$info")"
          parent="$(jq -r '.parent.full_name // empty' <<<"$info")"

          if [[ "$is_fork" != "true" ]]; then
            echo "::error::${BENCHMARK_REPOSITORY} is not a fork"
            exit 1
          fi
          if [[ "$parent" != "${UPSTREAM_REPOSITORY}" ]]; then
            echo "::error::${BENCHMARK_REPOSITORY}'s parent is '${parent}', expected '${UPSTREAM_REPOSITORY}'"
            exit 1
          fi

          echo "validated: benchmarks will run in ${BENCHMARK_REPOSITORY}, a fork of ${UPSTREAM_REPOSITORY}"

  generate-matrix:
    name: Generate benchmark matrix
    needs: validate-fork
    runs-on: ubuntu-latest
    outputs:
      entries_rep1: ${{ steps.gen.outputs.entries_rep1 }}
      entries_rep2: ${{ steps.gen.outputs.entries_rep2 }}
      entries_rep3: ${{ steps.gen.outputs.entries_rep3 }}
      groups_rep1: ${{ steps.gen.outputs.groups_rep1 }}
      groups_rep2: ${{ steps.gen.outputs.groups_rep2 }}
      groups_rep3: ${{ steps.gen.outputs.groups_rep3 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/cache-benchmark

      - name: Record harness/base/redesign SHAs
        run: |
          {
            echo "## Cache benchmark run"
            echo "- HARNESS_SHA: \`${HARNESS_SHA}\`"
            echo "- BASE_SHA: \`${{ inputs.base_sha }}\`"
            echo "- REDESIGN_SHA: \`${{ inputs.redesign_sha }}\`"
            echo "- BENCHMARK_REPOSITORY: \`${BENCHMARK_REPOSITORY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate and split matrix
        id: gen
        run: |
          set -euo pipefail
          chmod +x .github/scripts/cache-benchmark/generate-matrix.sh
          .github/scripts/cache-benchmark/generate-matrix.sh > all-entries.json
          jq 'length' all-entries.json

          for rep in 1 2 3; do
            jq -c --argjson rep "$rep" '[.[] | select(.rep == $rep)]' all-entries.json > "entries-rep${rep}.json"
            jq -c --argjson rep "$rep" \
              '[.[] | select(.rep == $rep)] | unique_by([.strategy, .group]) | map({strategy, group, prefix, pair_id})' \
              all-entries.json > "groups-rep${rep}.json"

            {
              echo "entries_rep${rep}<<__MATRIX_EOF__"
              cat "entries-rep${rep}.json"
              echo "__MATRIX_EOF__"
              echo "groups_rep${rep}<<__MATRIX_EOF__"
              cat "groups-rep${rep}.json"
              echo "__MATRIX_EOF__"
            } >> "$GITHUB_OUTPUT"
          done

  cold-rep1:
    name: Cold / rep 1
    needs: generate-matrix
    uses: ./.github/workflows/cache-benchmark-phase.yaml
    with:
      phase: cold
      rep: 1
      entries_json: ${{ needs.generate-matrix.outputs.entries_rep1 }}
      base_sha: ${{ inputs.base_sha }}
      redesign_sha: ${{ inputs.redesign_sha }}
      benchmark_repository: banacorn/agda-language-server
      stack_version: '3.1.1'
      ghc_wasm_meta_commit_hash: 'c3f44696d29aaeadd755d69c51735954bfcd59db'
      ghc_wasm_meta_flavour: '9.10'
      alex_version: '3.5.0.0'
      happy_version: '1.20.1.1'

  warm-rep1:
    name: Warm / rep 1
    needs: [generate-matrix, cold-rep1]
    uses: ./.github/workflows/cache-benchmark-phase.yaml
    with:
      phase: warm
      rep: 1
      entries_json: ${{ needs.generate-matrix.outputs.entries_rep1 }}
      base_sha: ${{ inputs.base_sha }}
      redesign_sha: ${{ inputs.redesign_sha }}
      benchmark_repository: banacorn/agda-language-server
      stack_version: '3.1.1'
      ghc_wasm_meta_commit_hash: 'c3f44696d29aaeadd755d69c51735954bfcd59db'
      ghc_wasm_meta_flavour: '9.10'
      alex_version: '3.5.0.0'
      happy_version: '1.20.1.1'

  settle-rep1:
    name: Settle / rep 1
    needs: [generate-matrix, warm-rep1]
    uses: ./.github/workflows/cache-benchmark-settle.yaml
    with:
      rep: 1
      groups_json: ${{ needs.generate-matrix.outputs.groups_rep1 }}
      benchmark_repository: banacorn/agda-language-server

  cold-rep2:
    name: Cold / rep 2
    needs: [generate-matrix, settle-rep1]
    uses: ./.github/workflows/cache-benchmark-phase.yaml
    with:
      phase: cold
      rep: 2
      entries_json: ${{ needs.generate-matrix.outputs.entries_rep2 }}
      base_sha: ${{ inputs.base_sha }}
      redesign_sha: ${{ inputs.redesign_sha }}
      benchmark_repository: banacorn/agda-language-server
      stack_version: '3.1.1'
      ghc_wasm_meta_commit_hash: 'c3f44696d29aaeadd755d69c51735954bfcd59db'
      ghc_wasm_meta_flavour: '9.10'
      alex_version: '3.5.0.0'
      happy_version: '1.20.1.1'

  warm-rep2:
    name: Warm / rep 2
    needs: [generate-matrix, cold-rep2]
    uses: ./.github/workflows/cache-benchmark-phase.yaml
    with:
      phase: warm
      rep: 2
      entries_json: ${{ needs.generate-matrix.outputs.entries_rep2 }}
      base_sha: ${{ inputs.base_sha }}
      redesign_sha: ${{ inputs.redesign_sha }}
      benchmark_repository: banacorn/agda-language-server
      stack_version: '3.1.1'
      ghc_wasm_meta_commit_hash: 'c3f44696d29aaeadd755d69c51735954bfcd59db'
      ghc_wasm_meta_flavour: '9.10'
      alex_version: '3.5.0.0'
      happy_version: '1.20.1.1'

  settle-rep2:
    name: Settle / rep 2
    needs: [generate-matrix, warm-rep2]
    uses: ./.github/workflows/cache-benchmark-settle.yaml
    with:
      rep: 2
      groups_json: ${{ needs.generate-matrix.outputs.groups_rep2 }}
      benchmark_repository: banacorn/agda-language-server

  cold-rep3:
    name: Cold / rep 3
    needs: [generate-matrix, settle-rep2]
    uses: ./.github/workflows/cache-benchmark-phase.yaml
    with:
      phase: cold
      rep: 3
      entries_json: ${{ needs.generate-matrix.outputs.entries_rep3 }}
      base_sha: ${{ inputs.base_sha }}
      redesign_sha: ${{ inputs.redesign_sha }}
      benchmark_repository: banacorn/agda-language-server
      stack_version: '3.1.1'
      ghc_wasm_meta_commit_hash: 'c3f44696d29aaeadd755d69c51735954bfcd59db'
      ghc_wasm_meta_flavour: '9.10'
      alex_version: '3.5.0.0'
      happy_version: '1.20.1.1'

  warm-rep3:
    name: Warm / rep 3
    needs: [generate-matrix, cold-rep3]
    uses: ./.github/workflows/cache-benchmark-phase.yaml
    with:
      phase: warm
      rep: 3
      entries_json: ${{ needs.generate-matrix.outputs.entries_rep3 }}
      base_sha: ${{ inputs.base_sha }}
      redesign_sha: ${{ inputs.redesign_sha }}
      benchmark_repository: banacorn/agda-language-server
      stack_version: '3.1.1'
      ghc_wasm_meta_commit_hash: 'c3f44696d29aaeadd755d69c51735954bfcd59db'
      ghc_wasm_meta_flavour: '9.10'
      alex_version: '3.5.0.0'
      happy_version: '1.20.1.1'

  settle-rep3:
    name: Settle / rep 3
    needs: [generate-matrix, warm-rep3]
    uses: ./.github/workflows/cache-benchmark-settle.yaml
    with:
      rep: 3
      groups_json: ${{ needs.generate-matrix.outputs.groups_rep3 }}
      benchmark_repository: banacorn/agda-language-server

  report:
    name: Aggregate report
    needs: settle-rep3
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/cache-benchmark

      - name: Download all measurements and settle inventories
        uses: actions/download-artifact@v4
        with:
          pattern: 'measurement-*'
          path: measurements
          merge-multiple: false

      - name: Download all settle inventories
        uses: actions/download-artifact@v4
        with:
          pattern: 'settle-*'
          path: settles
          merge-multiple: false

      - name: Aggregate report
        env:
          HARNESS_SHA: ${{ env.HARNESS_SHA }}
          BASE_SHA: ${{ inputs.base_sha }}
          REDESIGN_SHA: ${{ inputs.redesign_sha }}
        run: |
          chmod +x .github/scripts/cache-benchmark/aggregate-report.sh
          .github/scripts/cache-benchmark/aggregate-report.sh measurements settles

  cleanup:
    name: Cleanup benchmark caches
    needs:
      - validate-fork
      - cold-rep1
      - warm-rep1
      - settle-rep1
      - cold-rep2
      - warm-rep2
      - settle-rep2
      - cold-rep3
      - warm-rep3
      - settle-rep3
      - report
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/cache-benchmark

      - name: Delete any surviving benchmark cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/cache-benchmark/*.sh
          source .github/scripts/cache-benchmark/lib.sh

          inventory="$(cache_stable_inventory "${BENCHMARK_REPOSITORY}" "ci-cache-benchmark-")"
          n="$(jq 'length' <<<"$inventory")"
          echo "found ${n} surviving benchmark cache entries"

          if [[ "$n" -gt 0 ]]; then
            ids="$(jq -r '.[].id' <<<"$inventory")"
            cache_delete_ids "${BENCHMARK_REPOSITORY}" $ids
          fi

          remaining="$(cache_list_all "${BENCHMARK_REPOSITORY}" "ci-cache-benchmark-" | jq 'length')"
          if [[ "$remaining" -ne 0 ]]; then
            echo "::error::${remaining} ci-cache-benchmark-* cache entries remain in ${BENCHMARK_REPOSITORY} after cleanup"
            exit 1
          fi
          echo "no benchmark cache entries remain in ${BENCHMARK_REPOSITORY}"
