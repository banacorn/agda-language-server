# Reusable workflow: after a repetition's cold and warm phases both
# complete, take a stable inventory of each ownership group's caches,
# record their compressed sizes, and delete them before the next
# repetition starts. Called once per repetition by cache-benchmark.yaml.
name: Cache Benchmark Settle

on:
  workflow_call:
    inputs:
      rep:
        required: true
        type: number
      groups_json:
        required: true
        type: string
      benchmark_repository:
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  settle:
    name: settle / ${{ matrix.strategy }} / ${{ matrix.group }} / rep${{ inputs.rep }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    # One ownership group's writers must fully finish (the phase jobs this
    # workflow is called after) before its inventory read is meaningful;
    # concurrency here only guards against two settle runs for the *same*
    # group overlapping, which `needs` in the caller already prevents, so
    # this is a defensive backstop rather than the primary mechanism.
    concurrency:
      group: cache-benchmark-settle-${{ matrix.strategy }}-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.groups_json) }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/cache-benchmark

      - name: Settle group
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/cache-benchmark/*.sh
          bash .github/scripts/cache-benchmark/settle.sh \
            "${{ inputs.benchmark_repository }}" \
            "${{ matrix.prefix }}" \
            settle.json

      - name: Upload settle inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settle-${{ matrix.strategy }}-${{ matrix.group }}-rep${{ inputs.rep }}
          path: settle.json
          retention-days: 1
          if-no-files-found: warn
