name: Probe macOS toolchain

# Experiment, lives only on the fork's probe/unix-isolation branch.
#
# macos-latest builds fail to link with GHC 9.10.2:
#   ld: tapi error: malformed file
#   .../CommandLineTools/SDKs/MacOSX27.0.sdk/usr/lib/libSystem.B.tbd: unknown architecture
# This finds which developer directory / SDK on the image links correctly.

on:
  push:
    branches: [probe/unix-isolation]
    paths: [.github/workflows/probe-macos-toolchain.yaml]

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15]
    steps:
    - name: What is installed
      run: |
        sw_vers
        echo "--- xcode-select -p: $(xcode-select -p)"
        echo "--- Xcode apps"; ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
        echo "--- CLT SDKs"; ls /Library/Developer/CommandLineTools/SDKs/ 2>/dev/null || echo "(none)"
        echo "--- default ld"; ld -v 2>&1 | head -3
        echo "--- default clang"; clang --version | head -2
        echo "--- xcrun --show-sdk-path: $(xcrun --show-sdk-path)"
        echo "--- head of libSystem.B.tbd in the default SDK"
        head -6 "$(xcrun --show-sdk-path)/usr/lib/libSystem.B.tbd"

    - name: Install GHC 9.10.2 (as test.yaml does)
      uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
      with:
        ghc-version: '9.10.2'
        cabal-version: '3.12.1.0'

    - name: Where GHC thinks the C toolchain is
      run: |
        ghc --version
        ghc --info | grep -E 'C compiler|ld |Merge objects|ar command|LLVM' || true
        settings="$(dirname "$(ghc --print-libdir)")/lib/settings"
        [[ -f "$settings" ]] || settings="$(ghc --print-libdir)/settings"
        echo "--- $settings"; grep -iE 'sysroot|sdk|clang|ld' "$settings" || true
        echo "--- SDKROOT=${SDKROOT:-(unset)}  DEVELOPER_DIR=${DEVELOPER_DIR:-(unset)}"
        echo "--- clang -v link of an empty program (which SDK and ld does it pick?)"
        printf 'int main(void){return 0;}\n' > hello.c
        clang -v hello.c -o hello 2>&1 | grep -E '"/.*ld"|isysroot|-syslibroot|SDKs' | head -5

    - name: Try linking with each developer directory
      run: |
        printf 'int main(void){return 0;}\n' > hello.c
        printf 'main :: IO ()\nmain = putStrLn "hi"\n' > Hello.hs
        try() {  # $1 = label, rest = env assignments
          label=$1; shift
          echo "=== $label"
          rm -f hello Hello Hello.o Hello.hi
          if env "$@" clang hello.c -o hello > c.log 2>&1; then echo "  C link: ok"; else echo "  C link: FAIL"; head -5 c.log | sed 's/^/    /'; fi
          if env "$@" ghc -v0 Hello.hs -o Hello > hs.log 2>&1 && ./Hello > /dev/null; then echo "  GHC link: ok"; else echo "  GHC link: FAIL"; head -5 hs.log | sed 's/^/    /'; fi
        }
        try "default ($(xcode-select -p))" X=1
        try "SDKROOT=xcrun's SDK" SDKROOT="$(xcrun --show-sdk-path)"
        for app in /Applications/Xcode*.app; do
          [[ -d "$app" ]] || continue
          try "DEVELOPER_DIR=$app" DEVELOPER_DIR="$app/Contents/Developer"
        done
        for sdk in /Library/Developer/CommandLineTools/SDKs/MacOSX[0-9]*.sdk; do
          [[ -d "$sdk" ]] || continue
          try "SDKROOT=$sdk (CLT)" SDKROOT="$sdk"
        done

    - name: Where does GHC get the CommandLineTools SDK path from?
      if: ${{ !cancelled() }}
      run: |
        echo "--- package db fields mentioning an SDK"
        for p in rts ffi base ghc-prim ghc-bignum; do
          ghc-pkg describe --global "$p" 2>/dev/null | grep -iE 'sdk|CommandLineTools|library-dirs|extra-libraries|ld-options' | sed "s/^/$p: /" || true
        done
        echo "--- grep the whole GHC lib dir for CommandLineTools"
        grep -rIl "CommandLineTools" "$(ghc --print-libdir)" 2>/dev/null | head || true
        echo "--- the link command GHC runs"
        rm -f Hello Hello.o Hello.hi
        ghc -v3 Hello.hs -o Hello 2>&1 | grep -E 'Linking|"?gcc"?|clang|-L/|-isysroot|syslibroot' | grep -vE '^\*\*\*' | tail -5 || true

    - name: "Fix A: point the CLT MacOSX.sdk symlink at the newest SDK this ld understands"
      if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
      run: |
        clt=/Library/Developer/CommandLineTools/SDKs
        ls -la "$clt"
        good=$(printf '%s\n' "$clt"/MacOSX26.*.sdk | sort -V | tail -1)
        echo "repointing MacOSX.sdk -> $good"
        sudo ln -sfn "$(basename "$good")" "$clt/MacOSX.sdk"
        ls -la "$clt"
        rm -f Hello Hello.o Hello.hi
        if ghc -v0 Hello.hs -o Hello && ./Hello; then echo "FIX A: GHC link ok"; else echo "FIX A: GHC link FAIL"; fi

